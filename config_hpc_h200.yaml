project:
  name: "my-research"
  mode: "full-auto"

research:
  topic: "Using Monte Carlo Tree Search (MCTS) combined with Group Relative Policy Optimization (GRPO) to train Vision-Language-Action (VLA) models for robotic manipulation"
  domains:
    - "machine-learning"
    - "reinforcement-learning"
    - "robotics"
    - "vision-language-models"
  daily_paper_count: 10
  quality_threshold: 4.0

runtime:
  timezone: "Australia/Sydney"
  max_parallel_tasks: 3
  approval_timeout_hours: 12
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "openai"
  api_key_env: "OPENAI_API_KEY"
  primary_model: "gpt-5.4"
  fallback_models:
    - "gpt-4o"
  reasoning_effort: "high"

security:
  hitl_required_stages: []
  allow_publish_without_approval: true
  redact_sensitive_logs: true

experiment:
  mode: "sandbox"
  time_budget_sec: 600
  max_iterations: 10
  metric_key: "primary_metric"
  metric_direction: "minimize"
  sandbox:
    python_path: "/srv/scratch/z5428797/AutoResearchClaw/.venv/bin/python3"
    gpu_required: true
    max_memory_mb: 131072
    allowed_imports:
      - "numpy"
      - "scipy"
      - "torch"
      - "torchvision"
      - "torchaudio"
      - "sklearn"
      - "matplotlib"
      - "seaborn"
      - "pandas"
      - "transformers"
      - "datasets"
      - "accelerate"
      - "peft"
      - "trl"
      - "bitsandbytes"
      - "timm"
      - "einops"
      - "torchmetrics"
      - "PIL"
      - "evaluate"
      - "safetensors"
      - "tokenizers"
      - "sentencepiece"
      - "tqdm"
      - "json"
      - "time"
      - "os"
      - "sys"
      - "math"
      - "random"
      - "collections"
      - "itertools"
      - "functools"
      - "typing"
      - "dataclasses"
      - "pathlib"
      - "csv"
      - "h5py"
      - "tensorboard"

prompts:
  custom_file: ""
